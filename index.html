<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KarhutlaWatch - Beranda</title>
    <style>
        /* --- STOCKBIT BRANDING COLORS & BASE STYLE --- */
        :root {
            --bg-main: #0d1117;       /* Hitam elegan khas Stockbit Dark */
            --bg-card: #161b22;       /* Warna kartu/kontainer */
            --text-primary: #f0f6fc;  /* Teks putih terang */
            --text-muted: #8b949e;    /* Teks abu-abu sekunder */
            --brand-green: #00e676;   /* Hijau toska ikonik Stockbit */
            --border-color: #30363d;  /* Garis pembatas tipis */
            --danger-red: #ff4d4f;    /* Warna bahaya */
            --warning-orange: #ffa940;/* Warna waspada */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-primary);
            padding-bottom: 40px;
        }

        /* --- NAVBAR --- */
        nav {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo { font-weight: 800; font-size: 1.2rem; color: var(--text-primary); }
        nav .logo span { color: var(--brand-green); }
        nav .badge { background: rgba(0, 230, 118, 0.1); color: var(--brand-green); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold;}

        /* --- LAYOUT UTAMA --- */
        .wrapper { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        .header-section { margin-bottom: 25px; }
        .header-section h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .header-section p { color: var(--text-muted); font-size: 0.95rem; }

        /* KARTU DASHBOARD ala Stockbit Stream */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* --- FORMULIR ELEGAN --- */
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        input, select {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            transition: border 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--brand-green); }
        
        /* TOMBOL UTAMA */
        button {
            background-color: var(--brand-green);
            color: #000; /* Teks gelap di atas tombol terang agar kontras */
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        /* --- PANEL HASIL --- */
        .hasil-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: none;
            border-left: 4px solid transparent;
        }
        .hasil-box.aman { background: rgba(0, 230, 118, 0.1); border-left-color: var(--brand-green); color: var(--brand-green); }
        .hasil-box.waspada { background: rgba(255, 169, 64, 0.1); border-left-color: var(--warning-orange); color: var(--warning-orange); }
        .hasil-box.bahaya { background: rgba(255, 77, 79, 0.1); border-left-color: var(--danger-red); color: var(--danger-red); }

        pre {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            color: #c9d1d9;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<!-- NAVBAR SIMPEL -->
<nav>
    <div class="logo">Karhutla<span>Watch</span></div>
    <div class="badge">PROYEK SATGAS</div>
</nav>

<div class="wrapper">
    <!-- HEADER -->
    <div class="header-section">
        <h1>Dashboard Siaga</h1>
        <p>Alat ukur parameter udara lapangan dan pelaporan cepat bencana.</p>
    </div>

    <!-- PANEL 1: ANALISIS INDIKATOR -->
    <div class="card">
        <div class="card-title">🌡️ Indikator Risiko Cuaca</div>
        <label for="suhu">TEMPERATUR UDARA (°C)</label>
        <input type="number" id="suhu" placeholder="Masukkan suhu saat ini, misal: 34">
        <button onclick="cekRisiko()">Analisis Indikator</button>
        <div id="boxHasil" class="hasil-box"></div>
    </div>

    <!-- PANEL 2: PUSAT LAPORAN -->
    <div class="card">
        <div class="card-title">📝 Generator Laporan Cepat</div>
        
        <label for="nama">NAMA RELEWAN / PELAPOR</label>
        <input type="text" id="nama" placeholder="Tulis nama lengkap Anda">
        
        <label for="lokasi">LOKASI TITIK API / KOORDINAT GPS</label>
        <input type="text" id="lokasi" placeholder="Contoh: Desa Makmur, Kec. Sejahtera / -2.564, 115.123">
        
        <label for="kondisi">ESKALASI KEBAKARAN</label>
        <select id="kondisi">
            <option value="Titik api kecil, asap masih tipis putih">Skala Kecil (Asap Tipis)</option>
            <option value="Api menjalar cepat, asap tebal hitam membuang tinggi">Skala Menengah (Menjalar Cepat)</option>
            <option value="Kebakaran hebat, sangat dekat dengan pemukiman warga">Skala Darurat (Dekat Pemukiman)</option>
        </select>
        
        <button onclick="buatLaporan()">Generate Laporan WhatsApp</button>
        
        <div id="AreaLaporan" style="display:none; margin-top:20px;">
            <label>PREVIEW TEKS (OTOMATIS TERSALIN)</label>
            <pre id="teksLaporan"></pre>
        </div>
    </div>
</div>

<script>
    function cekRisiko() {
        const suhu = document.getElementById('suhu').value;
        const box = document.getElementById('boxHasil');
        
        if (!suhu) { return alert("Input suhu tidak boleh kosong."); }

        box.style.display = "block";
        
        if (suhu < 30) {
            box.className = "hasil-box aman";
            box.innerHTML = "🟢 LOW RISK (Aman)<br>Suhu terpantau normal. Lakukan patroli berkala.";
        } else if (suhu >= 30 && suhu <= 35) {
            box.className = "hasil-box waspada";
            box.innerHTML = "🟡 MEDIUM RISK (Waspada)<br>Suhu tinggi. Dilarang melakukan aktivitas pembakaran apa pun.";
        } else {
            box.className = "hasil-box bahaya";
            box.innerHTML = "🔴 HIGH RISK (Bahaya Eksplosif)<br>Kondisi kritis. Siagakan tangki air dan koordinasi tim pemadam.";
        }
    }

    function buatLaporan() {
        const nama = document.getElementById('nama').value;
        const lokasi = document.getElementById('lokasi').value;
        const kondisi = document.getElementById('kondisi').value;
        const waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

        if (!nama || !lokasi) { return alert("Harap isi Nama dan Lokasi."); }

        const formatTeks = `🚨 *LAPORAN DARURAT KARHUTLA* 🚨\n` +
                           `--------------------------------------\n` +
                           `📅 Waktu Terdeteksi : ${waktu} WIB\n` +
                           `👤 Personil Pelapor : ${nama}\n` +
                           `📍 Lokasi Koordinat : ${lokasi}\n` +
                           `🔥 Eskalasi Visual  : ${kondisi}\n\n` +
                           `*Tindakan:* Mohon segera kirimkan unit tangki air dan regu pemadam ke lokasi!`;

        document.getElementById('teksLaporan').innerText = formatTeks;
        document.getElementById('AreaLaporan').style.display = "block";

        navigator.clipboard.writeText(formatTeks);
        alert("Sukses! Teks laporan dengan style profesional telah disalin ke clipboard.");
    }
</script>

</body>
</html>
